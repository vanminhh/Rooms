services:
  - type: web
    name: rooms-demo-api
    runtime: node
    plan: free
    region: singapore
    branch: master
    rootDir: Source/backend
    buildCommand: npm ci --include=dev && npx --no-install prisma generate && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "24.22.0"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "0"
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CCCD_KEY
        sync: false
