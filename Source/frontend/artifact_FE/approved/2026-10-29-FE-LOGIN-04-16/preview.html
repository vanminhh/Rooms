<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Xem thử đăng nhập và layout (bản nháp, không chép vào repo)." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=Taviraj:ital,wght@0,200;0,300;0,400;1,200;1,300&display=swap" rel="stylesheet" />
    <title>Rooms · Xem thử đăng nhập (bản nháp)</title>
  </head>
  <body>
    <div id="draft-status" style="position: fixed; left: 0; right: 0; bottom: 0; z-index: 9999; padding: 4px 8px; font: 12px monospace; background: CanvasText; color: Canvas;"></div>
    <div id="root"></div>
    <script type="module">
      // Draft-only harness: fake /api/v1 with illustrative data (not the real seed). Rules follow PLAN.md section 2.
      const query = new URLSearchParams(location.search)
      const path = query.get('path') || '/dang-nhap'
      const session = query.get('session') || 'none'
      const contactMode = query.get('contact') || 'full'
      let bootMode = query.get('boot') === 'error' ? 'error' : 'ok'

      const PASSWORD = 'matkhau123'
      const LOCKED = '0900000005'
      const RATE_LIMITED = '0900000009'
      const TAKEN_EMAIL = 'trung@example.com'
      const RESET_TOKEN = 'hople'
      const PHONE_RE = /^0[0-9]{9}$/
      const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/
      const SESSION_PHONE = { none: null, tenant: '0900000004', 'tenant-must-change': '0900000004', manager: '0900000002', 'manager-empty': '0900000003', boss: '0900000001' }

      const accounts = {
        '0900000001': { role: 'BOSS', fullName: 'Phạm Minh Đức', buildings: [
          { id: 1, code: 'A01', name: 'Tòa Ánh Dương' },
          { id: 2, code: 'A02', name: 'Tòa Hoa Sữa' },
          { id: 3, code: 'A03', name: 'Tòa Nắng Mới' },
        ] },
        '0900000002': { role: 'MANAGER', fullName: 'Nguyễn Thu Hà', buildings: [
          { id: 1, code: 'A01', name: 'Tòa Ánh Dương' },
          { id: 2, code: 'A02', name: 'Tòa Hoa Sữa' },
        ] },
        '0900000003': { role: 'MANAGER', fullName: 'Trần Quốc Bảo', buildings: [] },
        '0900000004': { role: 'TENANT', fullName: 'Nguyễn Văn An' },
      }
      const passwords = Object.fromEntries(Object.keys(accounts).map(phone => [phone, PASSWORD]))
      const profiles = Object.fromEntries(Object.keys(accounts).map(phone => [phone, { email: null, contactPhone: null, zaloUrl: null, facebookUrl: null }]))
      // The seeded tenant must change the password at first login (AUTH-05); session=tenant starts without the flag.
      const mustChange = { '0900000004': session !== 'tenant' }

      // Refresh cookie (who is signed in), current access token, and one-shot switches for the tester.
      let cookiePhone = SESSION_PHONE[session] ?? null
      let accessToken = null
      let tokenSeq = 0
      let failNextRefreshFlag = false

      const ok = data => ({ status: 200, body: { data } })
      const fail = (status, code, message, fields) => ({ status, body: { error: fields ? { code, message, fields } : { code, message } } })
      const VALIDATION = 'Dữ liệu không hợp lệ'
      const UNAUTH = 'Bạn cần đăng nhập để tiếp tục'
      const INTERNAL = 'Có lỗi xảy ra, vui lòng thử lại sau'
      const newToken = () => `draft-token-${++tokenSeq}`

      function me(phone) {
        const account = accounts[phone]
        const profile = profiles[phone]
        return {
          id: Object.keys(accounts).indexOf(phone) + 1,
          role: account.role,
          phone,
          fullName: account.fullName,
          email: profile.email,
          mustChangePassword: Boolean(mustChange[phone]),
          contactPhone: profile.contactPhone,
          zaloUrl: profile.zaloUrl,
          facebookUrl: profile.facebookUrl,
          ...(account.buildings ? { buildings: account.buildings } : {}),
        }
      }

      // Every route except login, refresh, logout and public contact needs the current Bearer token.
      function authed(bearer, run) {
        if (!bearer || bearer !== accessToken) return fail(401, 'UNAUTHENTICATED', UNAUTH)
        return run()
      }

      function login(body) {
        const fields = {}
        if (!PHONE_RE.test(body.phone ?? '')) fields.phone = 'Số điện thoại không hợp lệ'
        if (!body.password) fields.password = 'Vui lòng nhập mật khẩu'
        if (Object.keys(fields).length) return fail(400, 'VALIDATION_FAILED', VALIDATION, fields)
        if (body.phone === LOCKED) return fail(403, 'ACCOUNT_LOCKED', 'Tài khoản đã bị khóa. Liên hệ quản lý.')
        if (body.phone === RATE_LIMITED) return fail(429, 'TOO_MANY_REQUESTS', 'Bạn thao tác quá nhiều lần, vui lòng thử lại sau')
        if (!accounts[body.phone] || passwords[body.phone] !== body.password) return fail(401, 'INVALID_CREDENTIALS', 'Số điện thoại hoặc mật khẩu không đúng')
        cookiePhone = body.phone
        accessToken = newToken()
        return ok({ accessToken, user: me(body.phone) })
      }

      function refresh() {
        if (bootMode === 'error') return fail(500, 'INTERNAL_ERROR', INTERNAL)
        if (failNextRefreshFlag) {
          failNextRefreshFlag = false
          cookiePhone = null
        }
        if (!cookiePhone) {
          accessToken = null
          return fail(401, 'UNAUTHENTICATED', UNAUTH)
        }
        accessToken = newToken()
        return ok({ accessToken })
      }

      function patchMe(body) {
        const phone = cookiePhone
        const profile = profiles[phone]
        const contactKeys = ['contactPhone', 'zaloUrl', 'facebookUrl']
        if (accounts[phone].role === 'TENANT' && contactKeys.some(key => key in body)) return fail(403, 'FORBIDDEN', 'Bạn không có quyền thực hiện thao tác này')
        const fields = {}
        for (const key of Object.keys(body)) {
          if (!(key in profile)) fields[key] = 'Trường này không được phép gửi lên'
        }
        const { email, contactPhone, zaloUrl, facebookUrl } = body
        if (email && !EMAIL_RE.test(email)) fields.email = 'Email không hợp lệ'
        else if (email === TAKEN_EMAIL) fields.email = 'Email đã được sử dụng'
        if (contactPhone && !PHONE_RE.test(contactPhone)) fields.contactPhone = 'Số điện thoại không hợp lệ'
        if (zaloUrl && !zaloUrl.startsWith('https://')) fields.zaloUrl = 'Đường dẫn không hợp lệ'
        if (facebookUrl && !facebookUrl.startsWith('https://')) fields.facebookUrl = 'Đường dẫn không hợp lệ'
        if (Object.keys(fields).length) return fail(400, 'VALIDATION_FAILED', VALIDATION, fields)
        for (const key of Object.keys(body)) profile[key] = body[key]
        return ok(me(phone))
      }

      function changePassword(body) {
        const phone = cookiePhone
        const fields = {}
        if (!body.currentPassword) fields.currentPassword = 'Vui lòng nhập mật khẩu hiện tại'
        else if (body.currentPassword !== passwords[phone]) fields.currentPassword = 'Mật khẩu hiện tại không đúng'
        if (String(body.newPassword ?? '').length < 8) fields.newPassword = 'Mật khẩu tối thiểu 8 ký tự'
        else if (body.newPassword === body.currentPassword) fields.newPassword = 'Mật khẩu mới phải khác mật khẩu hiện tại'
        if (Object.keys(fields).length) return fail(400, 'VALIDATION_FAILED', VALIDATION, fields)
        passwords[phone] = body.newPassword
        mustChange[phone] = false
        return ok(null)
      }

      function forgot(body) {
        if (!PHONE_RE.test(body.phone ?? '')) return fail(400, 'VALIDATION_FAILED', VALIDATION, { phone: 'Số điện thoại không hợp lệ' })
        return ok(null)
      }

      function reset(body) {
        if (body.token !== RESET_TOKEN) return fail(400, 'VALIDATION_FAILED', VALIDATION, { token: 'Liên kết đặt lại mật khẩu không hợp lệ hoặc đã hết hạn' })
        if (String(body.newPassword ?? '').length < 8) return fail(400, 'VALIDATION_FAILED', VALIDATION, { newPassword: 'Mật khẩu tối thiểu 8 ký tự' })
        return ok(null)
      }

      function publicContact() {
        if (contactMode === 'error') return fail(500, 'INTERNAL_ERROR', INTERNAL)
        if (contactMode === 'none') return ok(null)
        const boss = { phone: '0900000001', zaloUrl: 'https://zalo.me/0900000001', facebookUrl: 'https://www.facebook.com/trothongminh' }
        if (contactMode === 'partial') return ok({ phone: boss.phone, zaloUrl: null, facebookUrl: null })
        if (contactMode === 'unsafe') return ok({ ...boss, zaloUrl: 'javascript:alert(1)' })
        return ok(boss)
      }

      function handle(method, route, body, bearer) {
        if (method === 'GET' && route === '/public/contact') return publicContact()
        if (method === 'POST' && route === '/auth/login') return login(body)
        if (method === 'POST' && route === '/auth/refresh') return refresh()
        if (method === 'POST' && route === '/auth/logout') {
          cookiePhone = null
          accessToken = null
          return ok(null)
        }
        if (method === 'GET' && route === '/auth/me') return authed(bearer, () => ok(me(cookiePhone)))
        if (method === 'PATCH' && route === '/auth/me') return authed(bearer, () => patchMe(body))
        if (method === 'POST' && route === '/auth/change-password') return authed(bearer, () => changePassword(body))
        if (method === 'POST' && route === '/auth/forgot-password') return forgot(body)
        if (method === 'POST' && route === '/auth/reset-password') return reset(body)
        return fail(404, 'NOT_FOUND', 'Không tìm thấy dữ liệu')
      }

      // Installed before the app modules load; calls outside /api/v1 go to the real fetch.
      const realFetch = window.fetch.bind(window)
      window.__mock = {
        calls: [],
        expireAccessToken() { accessToken = null },
        failNextRefresh() { failNextRefreshFlag = true },
        setBoot(mode) { bootMode = mode },
      }
      window.fetch = async (input, init = {}) => {
        const url = typeof input === 'string' ? input : input.url
        if (!url.startsWith('/api/v1/')) return realFetch(input, init)
        const method = (init.method ?? 'GET').toUpperCase()
        const headers = Object.fromEntries(new Headers(init.headers ?? {}))
        const body = typeof init.body === 'string' ? JSON.parse(init.body) : undefined
        window.__mock.calls.push({ method, url, headers, body, credentials: init.credentials })
        await new Promise(resolve => setTimeout(resolve, 400))
        const bearer = headers.authorization?.replace('Bearer ', '') ?? null
        const { status, body: json } = handle(method, url.slice('/api/v1'.length), body ?? {}, bearer)
        return new Response(JSON.stringify(json), { status, headers: { 'Content-Type': 'application/json' } })
      }

      const [{ createElement, StrictMode }, { createRoot }, { RouterProvider, createMemoryRouter }] = await Promise.all([
        import('react'),
        import('react-dom/client'),
        import('react-router'),
      ])
      const { routes } = await import('./src/app/routes.tsx')
      const { AppProviders } = await import('./src/app/AppProviders.tsx')

      const router = createMemoryRouter(routes, { initialEntries: [path] })
      // Shows the current location outside .rooms-theme so the tester can read where navigation ended.
      const status = document.getElementById('draft-status')
      const showLocation = state => {
        const { pathname, search, state: navState } = state.location
        status.textContent = `${pathname}${search}${navState ? ` state=${JSON.stringify(navState)}` : ''}`
      }
      showLocation(router.state)
      router.subscribe(showLocation)

      createRoot(document.getElementById('root')).render(
        createElement(StrictMode, null,
          createElement(AppProviders, null,
            createElement(RouterProvider, { router }))),
      )
    </script>
  </body>
</html>
